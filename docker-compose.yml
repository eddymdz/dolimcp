# Dolibarr + DoliMCP (MCP Streamable HTTP is served by the dolimcp module inside Dolibarr).
#
# Start:  docker compose up -d
# MCP URL: http://localhost:8081/custom/dolimcp/mcp.php

services:
  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dolidb}
      MYSQL_USER: ${MYSQL_USER:-dolidbuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dolidbpass}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: dolibarr/dolibarr:latest
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${DOLI_HTTP_PORT:-8081}:80"
    environment:
      DOLI_INSTALL_AUTO: "1"
      DOLI_INIT_DEMO: ${DOLI_INIT_DEMO:-1}
      DOLI_DB_HOST: mariadb
      DOLI_DB_NAME: ${MYSQL_DATABASE:-dolidb}
      DOLI_DB_USER: ${MYSQL_USER:-dolidbuser}
      DOLI_DB_PASSWORD: ${MYSQL_PASSWORD:-dolidbpass}
      DOLI_URL_ROOT: ${DOLI_URL_ROOT:-http://localhost:8081}
      DOLI_ADMIN_LOGIN: ${DOLI_ADMIN_LOGIN:-admin}
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD:-admin}
      DOLI_COMPANY_NAME: ${DOLI_COMPANY_NAME:-Demo Company}
      DOLI_COMPANY_COUNTRYCODE: ${DOLI_COMPANY_COUNTRYCODE:-US}
      DOLI_ENABLE_MODULES: ${DOLI_ENABLE_MODULES:-Api,Projet,User,Hrm}
      WWW_USER_ID: ${WWW_USER_ID:-1000}
      WWW_GROUP_ID: ${WWW_GROUP_ID:-1000}
    volumes:
      - ./data/documents:/var/www/documents
      - ./htdocs/custom:/var/www/html/custom
      - ./docker/init:/var/www/scripts/docker-init.d:ro
